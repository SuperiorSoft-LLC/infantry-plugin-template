# Push a tag v<module.json version> (for example v1.0.0): builds, tests, packs the .ihq and publishes a GitHub release with
# <Name>.ihq and catalog-entry.json. Optional signing: secrets IHQ_KEYSTORE_B64 (base64 of the keystore), IHQ_STOREPASS, IHQ_ALIAS.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
      IHQ_ALIAS: ${{ secrets.IHQ_ALIAS }}
      IHQ_KEYSTORE_B64: ${{ secrets.IHQ_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag equals module.json's version
        run: |
          version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' module.json | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match module.json version v$version" >&2
            exit 1
          fi
      - name: Build and test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -Pinfantry.sdk.githubPackages=true --console=plain
      - name: Package (signed when the secrets exist)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sign=""
          if [ -n "$IHQ_KEYSTORE_B64" ] && [ -n "$IHQ_STOREPASS" ] && [ -n "$IHQ_ALIAS" ]; then
            echo "$IHQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ihq.p12"
            sign="-Pihq.keystore=$RUNNER_TEMP/ihq.p12 -Pihq.alias=$IHQ_ALIAS"
          fi
          name=$(sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' module.json | head -n 1)
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$name.ihq"
          ./gradlew ihq catalogEntry -Pinfantry.sdk.githubPackages=true -Pihq.url="$url" $sign --console=plain
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/ihq/*.ihq build/ihq/catalog-entry.json --title "$GITHUB_REF_NAME" --generate-notes
